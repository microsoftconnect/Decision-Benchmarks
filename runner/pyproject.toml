[project]
name = "dbrun"
version = "0.1.0"
description = "Run decision benchmarks against a System One endpoint and score the answers."
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
dbrun = "dbrun.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dbrun"]
